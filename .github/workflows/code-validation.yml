name: Code validation
on:
  push:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-validation:
    name: Code validation
    runs-on: ubuntu-latest
    environment: ci-test
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: video_processing_app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CONTAINER: true
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKEND_JWT_SECRET: ${{ secrets.BACKEND_JWT_SECRET }}
      BACKEND_CORS_ORIGINS: ${{ vars.BACKEND_CORS_ORIGINS }}
      BACKEND_VIDEO_MOCK_PASSWORD_HASH: ${{ vars.BACKEND_VIDEO_MOCK_PASSWORD_HASH }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup system dependencies
        uses: ./.github/actions/setup-system-deps
      - name: Setup Cargo
        uses: ./.github/actions/setup-cargo
      - name: Setup NodeJS
        uses: ./.github/actions/setup-nodejs
      - name: Run Database Migrations
        run: cd modules/backend && cargo sqlx migrate run
      - name: Generate openapi client
        run: |
          make generate-openapi
          make prepare-frontend-local
      - name: Validate code
        run: |
          make check
      - name: Validate linters
        run: |
          make format-check
      - name: Validate tests
        run: |
          make test