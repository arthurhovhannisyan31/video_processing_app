name: Code validation
on:
  push:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-validation:
    name: Code validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: video_processing_app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      BACKEND_JWT_SECRET: ${{ vars.BACKEND_JWT_SECRET }}
      BACKEND_CORS_ORIGINS: ${{ vars.BACKEND_CORS_ORIGINS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Cargo
        uses: ./.github/actions/setup-cargo
      - name: Setup NodeJS
        uses: ./.github/actions/setup-nodejs
      - name: Run Database Migrations
        run: cd modules/backend && cargo sqlx migrate run
      - name: Generate openapi spec and client
        run: |
          make generate-openapi
          make prepare-frontend
      - name: Validate code
        run: |
          make check
      - name: Validate linters
        run: |
          make format-check
      - name: Create temp .env file for sqlx migrations
        run: |
          touch .env
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > .env
          echo "BACKEND_JWT_SECRET=${{ env.BACKEND_JWT_SECRET }}" > .env
          echo "BACKEND_CORS_ORIGINS=${{ env.BACKEND_CORS_ORIGINS }}" > .env
      - name: Validate unit tests
        run: |
          make test-ci