name: Server build and deploy
on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip build/push and redeploy the current image tag'
        required: false
        default: false
        type: boolean

jobs:
  build-and-deploy:
    name: Server build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup system dependencies
        if: ${{ !inputs.skip_build }}
        uses: ./.github/actions/setup-system-deps

      - name: Setup Cargo
        if: ${{ !inputs.skip_build }}
        uses: ./.github/actions/setup-cargo

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ !inputs.skip_build }}
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        if: ${{ !inputs.skip_build }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./configs/docker/backend.dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/video-processing-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/video-processing-app:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fix permissions for upload
        run: chmod +r ./docker-compose.prod.yml

      - name: Upload files to ssh server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_PASSPHRASE }}
          source: "docker-compose.prod.yml"
          target: "/root/server/"

      - name: Upload files to ssh server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_PASSPHRASE }}
          source: "./configs/nginx/nginx.prod.conf,./configs/nginx/nginx.certbot.conf,./configs/scripts/server-setup.sh"
          target: "/root/server/"
          strip_components: 3

      - name: Write env variables to host
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_PASSPHRASE }}
          script: |
            # Determine image tag value
            NEW_TAG="${{ !inputs.skip_build && steps.tag.outputs.sha || '' }}"
            CURRENT_TAG=$(grep '^IMAGE_TAG=' /root/server/.env 2>/dev/null | cut -d= -f2- || true)
            IMAGE_TAG=${NEW_TAG:-${CURRENT_TAG:-latest}}
            
            # Ensure env file exists
            mkdir -p /root/server
            touch /root/server/.env
            {
              printf "%s='%s'\n" IMAGE_TAG $IMAGE_TAG
              printf "%s='%s'\n" IS_PRODUCTION true
              printf "%s='%s'\n" POSTGRES_DB ${{ vars.POSTGRES_DB }}
              printf "%s='%s'\n" POSTGRES_HOST ${{ vars.POSTGRES_HOST }}
              printf "%s='%s'\n" POSTGRES_PASSWORD ${{ secrets.POSTGRES_PASSWORD }}
              printf "%s='%s'\n" POSTGRES_PORT ${{ vars.POSTGRES_PORT }}
              printf "%s='%s'\n" POSTGRES_USER ${{ vars.POSTGRES_USER }}
              printf "%s='%s'\n" DATABASE_URL ${{ secrets.DATABASE_URL }}
              printf "%s='%s'\n" BACKEND_HOST ${{ vars.BACKEND_HOST }}
              printf "%s='%s'\n" BACKEND_HTTP_PORT ${{ vars.BACKEND_HTTP_PORT }}
              printf "%s='%s'\n" BACKEND_JWT_SECRET ${{ secrets.BACKEND_JWT_SECRET }}
              printf "%s='%s'\n" BACKEND_CORS_ORIGINS ${{ vars.BACKEND_CORS_ORIGINS }}
              printf "%s='%s'\n" BACKEND_DB_MAX_CONNECTIONS ${{ vars.BACKEND_DB_MAX_CONNECTIONS }}
              printf "%s='%s'\n" BACKEND_VIDEO_MAX_BODY_SIZE ${{ vars.BACKEND_VIDEO_MAX_BODY_SIZE }}
              printf "%s='%s'\n" BACKEND_VIDEO_RATE_LIMIT_PERIOD_SEC ${{ vars.BACKEND_VIDEO_RATE_LIMIT_PERIOD_SEC }}
              printf "%s='%s'\n" BACKEND_VIDEO_RATE_LIMIT_SIZE ${{ vars.BACKEND_VIDEO_RATE_LIMIT_SIZE }}
              printf "%s='%s'\n" BACKEND_VIDEO_INSPECT_TIMEOUT ${{ vars.BACKEND_VIDEO_INSPECT_TIMEOUT }}
              printf "%s='%s'\n" BACKEND_VIDEO_PROCESS_TIMEOUT ${{ vars.BACKEND_VIDEO_PROCESS_TIMEOUT }}
              printf "%s='%s'\n" BACKEND_VIDEO_MOCK_PASSWORD_HASH ${{ vars.BACKEND_VIDEO_MOCK_PASSWORD_HASH }}
              printf "%s='%s'\n" SENTRY_DSN ${{ secrets.SENTRY_DSN }}
            } > /root/server/.env.new
            
            # replace old env file with new one
            mv /root/server/.env.new /root/server/.env
            chmod 600 /root/server/.env

      - name: Pull docker image and restart server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_PASSPHRASE }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            cd /root/server
            ./server-setup.sh

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_PASSPHRASE }}
          script: docker image prune -af