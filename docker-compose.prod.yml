services:
  db:
    container_name: app_db
    image: postgres:18.4
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
          pids: 200
        reservations:
          memory: 512M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
  #================================================
  backend:
    container_name: app_server
    image: arthurhovhannisyan31/video-processing-app:${IMAGE_TAG:-latest}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "${BACKEND_HTTP_PORT}:${BACKEND_HTTP_PORT}"
    environment:
      - CONTAINER=true
      - IS_PRODUCTION=true
    healthcheck:
      test: [ "CMD-SHELL", "./backend-healthcheck.sh" ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.5'
          pids: 200
        reservations:
          memory: 2G
          cpus: '1.5'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  #================================================
  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - webroot:/var/www/certbot:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  #================================================
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    depends_on:
      - nginx
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    restart: unless-stopped

volumes:
  certbot-etc:
  certbot-var:
  webroot:
  pg_data: