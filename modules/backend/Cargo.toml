[package]
version = "0.1.0"
name = "backend"
edition = "2024"
description = "Video processing application"
license = "MIT OR Apache-2.0"
authors = ["Arthur Hovhannisyan <arthurhovhannisyan31@gmail.com>"]
repository = "https://github.com/arthurhovhannisyan31/template"
default-run = "backend"

[[bin]]
name = "openapi-generator"
path = "src/bin/openapi_generator.rs"

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12", features = ["typed-header", "cookie"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
headers = "0.4"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
serde = { version = "1.0", features = ['derive'] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "process"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["full"] }
tower_governor = "0.8.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono", "time"] }
utoipa = { version = "5.5", features = ["yaml"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
axum-test = "21.0"
proptest = { version = "1.11.0", features = ["regex-syntax"] }
