# Copied by the deploy workflow into /etc/nginx/conf.d/ on the Hetzner host.
# Assumes nginx + certbot are already installed and managing certs for other
# apps on this host (same pattern as the gateway on the shared server) — this
# file only adds the server blocks for this app's domain.
#
# api.videoprocessing.app must point (A record) at this host, and a cert for
# it must exist under /etc/letsencrypt/live/api.videoprocessing.app/ before
# nginx will start serving this block (run certbot for the domain once first).
server {
    listen 80;
    server_name api.videoprocessing.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.videoprocessing.app;

    ssl_certificate     /etc/letsencrypt/live/api.videoprocessing.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.videoprocessing.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 512M;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
