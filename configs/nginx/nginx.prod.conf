events {
    worker_connections 1024;
}

http {
    # Dynamically set the 'Connection' header based on the 'Upgrade' header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Allocate 10m ram for IPs lookup table
    limit_conn_zone $binary_remote_addr zone=addr_zone:10m;

    # Catch-all for requests not addressed to a known host (e.g. scanners hitting the bare IP):
    # close the connection without a response
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        # Abort TLS handshake when SNI doesn't match a known host; no certificate needed
        ssl_reject_handshake on;
    }

    # Redirect all plain HTTP traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name api.videoprocessing.app;

        # Necessary for Certbot domain verification challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.videoprocessing.app;
        client_max_body_size 5M;
        http2 on;

        # Prevent API responses from showing up in search results
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Certificates paths
        ssl_certificate /etc/letsencrypt/live/api.videoprocessing.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.videoprocessing.app/privkey.pem;

        # Security configs
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Anything outside /api/ is not served: no static files, no error-log noise
        location / {
            log_not_found off;
            return 404;
        }

        # HTTP API endpoints
        location /api/ {
            # 'backend' matches the service name in docker-compose
            proxy_pass http://backend:8080;

            # Pass vital headers to Rust
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr; # use $remote_addr for rate limiting
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for large video uploads/streaming
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 30s;
        }

        # Video WebSocket Endpoint
        location /api/video/ws {
            proxy_pass http://backend:8080;
            # Restrict max connections per IP
            limit_conn addr_zone 50;

            # WebSocket specific headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Pass-through standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keeping connection alive for long-standing connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
