events {}

http {
    # Dynamically set the 'Connection' header based on the 'Upgrade' header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirect all plain HTTP traffic to HTTPS
    server {
        listen 80;
        server_name api.videoprocessing.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        client_max_body_size 10M;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.videoprocessing.app;

        # Certificates paths
        ssl_certificate /etc/letsencrypt/live/api.videoprocessing.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.videoprocessing.app/privkey.pem;

        # Security configs
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 10M;

        # HTTP API endpoints
        location /api {
            # 'backend' matches the service name in docker-compose
            proxy_pass http://backend:8080;

            # Pass vital headers to Rust
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for large video uploads/streaming
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
        }

        # Video WebSocket Endpoint
        location /api/video/ws {
            proxy_pass http://backend:8080;

            # WebSocket specific headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Pass-through standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keeping connection alive for long-standing connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}