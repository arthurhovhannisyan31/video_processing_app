events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # Redirect all plain HTTP traffic to HTTPS
    server {
        listen 80;
        server_name api.videoprocessing.app;

        client_max_body_size 20M;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.videoprocessing.app;

        ssl_certificate /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 20M;


        location /api {
            # 'backend' matches the service name in docker-compose
            proxy_pass http://backend:8080;

            # Pass vital headers to Rust
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for large video uploads/streaming
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 30s;
        }
    }
}