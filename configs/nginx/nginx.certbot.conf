events {}

http {
    server {
        listen 80;
        listen [::]:80;
        server_name api.videoprocessing.app;

        # Necessary for Certbot domain verification challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic from HTTP to HTTPS
        location / {
            return 200 "Nginx is up"; # Temporary test line
        }
    }
}
