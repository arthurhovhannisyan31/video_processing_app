events {}

http {
    # Dynamically set the 'Connection' header based on the 'Upgrade' header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name api.videoprocessing.app;

        client_max_body_size 10M;

        location /api {
            # 'backend' matches the service name in docker-compose
            proxy_pass http://backend:8081;

            # Pass vital headers to Rust
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for large video uploads/streaming
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
        }

        # Video WebSocket Endpoint
        location /api/video/ws {
            proxy_pass http://backend:8081;

            # WebSocket specific headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Pass-through standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keeping connection alive for long-standing connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}